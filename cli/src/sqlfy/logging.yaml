version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stderr

loggers:
  sqlfy:
    level: DEBUG
    handlers: [console]
    propagate: false

  main:
    level: DEBUG
    handlers: [console]
    propagate: false


root:
  level: WARNING
  handlers: [console]
