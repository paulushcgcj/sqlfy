target-version = "py311"

# Enable rules by default (matching current code style)
lint.select = [
    "F",   # pyflakes — errors
    "E",   # pycodestyle — errors
    "W",   # pycodestyle — warnings
    "I",   # isort — import ordering
    "N",   # pep8-naming — naming conventions
    "UP",  # pyupgrade — modern syntax
    "B",   # flake8-bugbear — bug detection
    "SIM", # flake8-simplify — simplification
]

# Rules to explicitly avoid (codebase convention)
lint.ignore = [
    "B007",   # unused loop control variable — some tests use loops for side effects
    "B008",   # function call in argument defaults — typer uses this pattern
    "B904",   # raise within except clause — codebase uses simple raise
    "E501",   # line too long — project already has long lines
    "E701",   # multiple statements on one line (colon) — codebase uses compact style
    "E702",   # multiple statements on one line (semicolon) — codebase uses compact style
    "E741",   # ambiguous variable name — some variables are single letters
    "N802",   # function name should be lowercase — allows legacy CamelCase
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "N815",   # mixedCase variable in class scope — external API fields (Excalidraw)
    "SIM102", # use single if instead of nested — codebase uses nested for clarity
    "SIM105", # use contextlib.suppress — codebase uses try/except/pass
    "SIM108", # use ternary operator — current style prefers if/else
    "W293",   # blank line contains whitespace — docstrings have trailing whitespace
]

# Import ordering
lint.isort.required-imports = ["from __future__ import annotations"]
lint.isort.combine-as-imports = true
lint.isort.known-first-party = ["sqlfy"]

# Allow computing  (flake8-use-pathlib)
lint.per-file-ignores."__init__.py" = ["F401"]

[format]
docstring-code-format = true
docstring-code-line-length = 88
line-ending = "lf"

