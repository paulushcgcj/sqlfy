<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" role="img" aria-label="SQLfy Schema Graph Engine — parses Flyway migrations into a reconstructed schema graph">
  <title>SQLfy Schema Graph Engine</title>
  <defs>
    <radialGradient id="bg-grad" cx="18%" cy="18%" r="85%" fx="18%" fy="18%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#0a0f1c" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0a1120" stop-opacity="0.96" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16233d" stroke-width="1" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#bg-grad)" />
  <rect width="1200" height="480" fill="url(#grid)" />

  <!-- Left column: brand + value -->
  <g transform="translate(64, 76)">
    <rect width="190" height="32" rx="16" fill="#0f1d33" stroke="#1e3a5f" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" fill="#34d399" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SCHEMA GRAPH ENGINE</text>

    <text x="0" y="98" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">SQLfy</text>

    <text x="0" y="146" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">Parse Flyway migrations into an AST, reconstruct</text>
    <text x="0" y="176" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">database state, and export LLM-ready context &amp; ERDs.</text>

    <g transform="translate(0, 214)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      <g transform="translate(0,0)">
        <rect width="128" height="34" rx="8" fill="#0f1d33" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="22" fill="#38bdf8">SQLGlot AST</text>
      </g>
      <g transform="translate(140,0)">
        <rect width="132" height="34" rx="8" fill="#0f1d33" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="22" fill="#34d399">Multi-Dialect</text>
      </g>
      <g transform="translate(284,0)">
        <rect width="116" height="34" rx="8" fill="#0f1d33" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="22" fill="#fbbf24">LLM Chunks</text>
      </g>
      <g transform="translate(412,0)">
        <rect width="104" height="34" rx="8" fill="#0f1d33" stroke="#1e3a5f" stroke-width="1" />
        <text x="14" y="22" fill="#c084fc">Tauri App</text>
      </g>
    </g>
  </g>

  <!-- Right: schema graph card -->
  <g transform="translate(700, 56)" filter="url(#soft-shadow)">
    <rect width="440" height="368" rx="14" fill="url(#card-bg)" stroke="#1e3a5f" stroke-width="1.5" />
    <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 426 0 C 433.732 0 440 6.268 440 14 L 440 40 L 0 40 Z" fill="#0f1d33" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" opacity="0.85" />
    <circle cx="40" cy="20" r="6" fill="#f59e0b" opacity="0.85" />
    <circle cx="60" cy="20" r="6" fill="#10b981" opacity="0.85" />
    <text x="220" y="25" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">schema.graph.json</text>

    <!-- USERS node -->
    <g transform="translate(30, 68)">
      <rect width="180" height="104" rx="8" fill="#0a1120" stroke="#3b82f6" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#1d4ed8" />
      <text x="14" y="19" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">TABLE · USERS</text>
      <text x="14" y="52" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">USER_ID   <tspan fill="#fbbf24">PK</tspan></text>
      <text x="14" y="72" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">EMAIL     VARCHAR</text>
      <text x="14" y="92" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">STATUS    VARCHAR</text>
    </g>

    <!-- ORDERS node -->
    <g transform="translate(232, 178)">
      <rect width="180" height="126" rx="8" fill="#0a1120" stroke="#10b981" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#047857" />
      <text x="14" y="19" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">TABLE · ORDERS</text>
      <text x="14" y="52" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">ORDER_ID  <tspan fill="#fbbf24">PK</tspan></text>
      <text x="14" y="72" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">USER_ID   <tspan fill="#34d399">FK</tspan></text>
      <text x="14" y="92" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">TOTAL     NUMERIC</text>
      <text x="14" y="112" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">CREATED_AT TIMESTAMP</text>
    </g>

    <!-- FK edge -->
    <g stroke="#10b981" stroke-width="2" fill="none">
      <path d="M 210 120 C 232 120 232 224 252 224" />
      <polygon points="248,220 256,224 248,228" fill="#10b981" stroke="none" />
    </g>

    <!-- status footer -->
    <g transform="translate(20, 308)">
      <rect width="400" height="32" rx="6" fill="#0a1120" stroke="#1e3a5f" stroke-width="1" />
      <path d="M 16 20 l 5 6 l 10 -12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="40" y="21" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">Reconstructed 12 tables · 18 FK edges (Oracle DDL)</text>
    </g>
  </g>
</svg>
