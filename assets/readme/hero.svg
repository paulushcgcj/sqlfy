<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <title>SQLfy Schema Graph Engine</title>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="20%" cy="20%" r="80%" fx="20%" fy="20%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Gradients for nodes & links -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg-grad)" />
  <rect width="1200" height="480" fill="url(#grid)" />

  <!-- Abstract Schema Connection Lines (Background Layer) -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6">
    <path d="M 720 140 C 820 140, 850 240, 950 240" />
    <path d="M 720 340 C 820 340, 850 240, 950 240" />
    <path d="M 950 140 C 1020 140, 1050 200, 1100 240" />
    <path d="M 620 240 L 720 140" stroke="#3b82f6" stroke-dasharray="none" stroke-width="2.5" opacity="0.8" />
    <path d="M 620 240 L 720 340" stroke="#10b981" stroke-dasharray="none" stroke-width="2.5" opacity="0.8" />
  </g>

  <!-- Left Column: Branding & Value Proposition -->
  <g transform="translate(64, 80)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" fill="#34d399" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SCHEMA GRAPH ENGINE</text>
    </g>

    <!-- Title -->
    <text x="0" y="90" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">SQLfy</text>
    
    <!-- Subtitle / Value prop -->
    <text x="0" y="135" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
      Parse Flyway migrations into an AST, reconstruct database state,
    </text>
    <text x="0" y="165" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
      and export LLM-ready vector context &amp; interactive ERDs.
    </text>

    <!-- Tech Stack / Feature Badges -->
    <g transform="translate(0, 210)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" fill="#38bdf8">⚡ SQLGlot AST</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(137, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" fill="#34d399">🔄 Multi-Dialect</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(294, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" fill="#fbbf24">🤖 LLM Chunks</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(441, 0)">
        <rect width="115" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" fill="#c084fc">🖥️ Tauri App</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Interactive Schema Graph Card Visual -->
  <g transform="translate(700, 60)" filter="url(#subtle-shadow)">
    <!-- Main Window Frame -->
    <rect width="440" height="360" rx="14" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Titlebar -->
    <path d="M 0 14 C 0 6.268, 6.268 0, 14 0 L 426 0 C 433.732 0, 440 6.268, 440 14 L 440 40 L 0 40 Z" fill="#1e293b" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" opacity="0.85" />
    <circle cx="40" cy="20" r="6" fill="#f59e0b" opacity="0.85" />
    <circle cx="60" cy="20" r="6" fill="#10b981" opacity="0.85" />
    <text x="220" y="25" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">sqlfy-schema-graph.json</text>

    <!-- Schema Node 1: USERS -->
    <g transform="translate(30, 70)" filter="url(#subtle-shadow)">
      <rect width="170" height="110" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
      <rect width="170" height="30" rx="8" fill="#1d4ed8" />
      <text x="15" y="20" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">TABLE: USERS</text>
      <text x="15" y="52" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">👤 USER_ID [PK]</text>
      <text x="15" y="72" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">📧 EMAIL [VARCHAR]</text>
      <text x="15" y="92" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">🏷️ STATUS [VARCHAR]</text>
    </g>

    <!-- Schema Node 2: ORDERS -->
    <g transform="translate(240, 180)" filter="url(#subtle-shadow)">
      <rect width="170" height="130" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <rect width="170" height="30" rx="8" fill="#047857" />
      <text x="15" y="20" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">TABLE: ORDERS</text>
      <text x="15" y="52" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">🔑 ORDER_ID [PK]</text>
      <text x="15" y="72" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">🔗 USER_ID [FK]</text>
      <text x="15" y="92" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">💰 TOTAL [NUMERIC]</text>
      <text x="15" y="112" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">📅 CREATED_AT</text>
    </g>

    <!-- Connection Arrow between USERS and ORDERS -->
    <g stroke="#10b981" stroke-width="2" fill="none">
      <path d="M 200 125 C 220 125, 220 220, 240 220" />
      <polygon points="236,216 244,220 236,224" fill="#10b981" stroke="none" />
    </g>

    <!-- Status Footer inside Card -->
    <g transform="translate(20, 315)">
      <rect width="400" height="30" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="15" y="20" fill="#10b981" font-family="ui-monospace, monospace" font-size="11">✓ Reconstructed 12 tables, 18 FK edges (Oracle DDL)</text>
    </g>
  </g>
</svg>
